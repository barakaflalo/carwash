<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0b" />
<title>ניהול שטיפת רכבים · AppNest</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0a0b; --surface:#141416; --surface2:#1c1c20; --line:#2a2a30;
    --text:#f5f5f2; --muted:#9a9aa2; --gold:#d4af37; --gold-soft:#b8952e;
    --grey:#6b7280; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
    --radius:16px;
  }
  html[data-theme="light"]{
    --bg:#f4f2ec; --surface:#ffffff; --surface2:#f0eee7; --line:#e3e0d6;
    --text:#1a1a1d; --muted:#6b6b72; --gold:#a9822a; --gold-soft:#8f6d1f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Noto Sans Arabic",Arial,sans-serif;
    line-height:1.5;overscroll-behavior-y:none}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  .hidden{display:none !important}

  .app{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  header.top{display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px calc(12px + env(safe-area-inset-top));
    position:sticky;top:0;background:linear-gradient(180deg,var(--bg),rgba(10,10,11,.0));
    backdrop-filter:blur(8px);z-index:20;border-bottom:1px solid var(--line)}
  html[data-theme="light"] header.top{background:var(--bg)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800}
  .brand .dot{width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--gold),var(--gold-soft));
    box-shadow:0 0 0 3px rgba(212,175,55,.15)}
  .brand small{color:var(--gold)}
  .hbtns{display:flex;gap:8px}
  .iconbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center}
  main{flex:1;padding:16px 16px 96px}
  h2.screen-title{font-size:20px;margin:4px 2px 14px}
  .muted{color:var(--muted)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:15px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .stack{display:flex;flex-direction:column;gap:10px}

  label.field{display:block;margin-bottom:12px}
  label.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input,select,textarea{width:100%;padding:13px 14px;background:var(--surface2);border:1px solid var(--line);
    color:var(--text);border-radius:12px;font-size:16px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;
    border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:15px;font-weight:600;width:100%}
  .btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold-soft));color:#1a1400;border:none}
  .btn.big{padding:20px;font-size:19px;font-weight:800}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--red);border-color:rgba(239,68,68,.4)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
  .s-grey{color:var(--grey);background:rgba(107,114,128,.16)}
  .s-blue{color:var(--blue);background:rgba(59,130,246,.16)}
  .s-green{color:var(--green);background:rgba(34,197,94,.16)}
  .s-red{color:var(--red);background:rgba(239,68,68,.16)}
  .s-amber{color:var(--amber);background:rgba(245,158,11,.16)}

  nav.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:0 auto;display:flex;
    background:var(--surface);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);z-index:20}
  nav.bottom button{flex:1;background:none;border:none;color:var(--muted);padding:10px 2px 12px;font-size:11px;
    display:flex;flex-direction:column;align-items:center;gap:4px}
  nav.bottom button .ic{font-size:19px}
  nav.bottom button.active{color:var(--gold)}

  .login-wrap{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px;max-width:420px;margin:0 auto}
  .login-brand{text-align:center;margin-bottom:24px}
  .login-brand .dot{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--gold),var(--gold-soft));box-shadow:0 0 0 4px rgba(212,175,55,.15)}
  .login-brand h1{margin:0;font-size:23px}
  .login-brand p{margin:6px 0 0;color:var(--gold);font-weight:700;font-size:14px}
  .login-top{display:flex;justify-content:center;gap:8px;margin-bottom:18px}

  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:40}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:760px;
    padding:20px;max-height:92dvh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .modal h3{margin:0 0 14px;font-size:18px}
  .modal .grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}

  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .stepper button{width:56px;height:52px;background:var(--surface2);border:none;color:var(--gold);font-size:24px}
  .stepper input{text-align:center;border:none;border-radius:0;border-inline:1px solid var(--line);font-size:20px;font-weight:800}

  .langrow{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);margin-bottom:8px;font-size:16px}
  .langrow.active{border-color:var(--gold)}

  #toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line);
    color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
  #toast.show{opacity:1}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .thumb{width:100%;border-radius:12px;margin-top:8px;border:1px solid var(--line)}
  .badge{text-align:center;color:var(--muted);font-size:11px;margin-top:22px}
  .spin{width:18px;height:18px;border:2px solid rgba(150,150,150,.4);border-top-color:var(--gold);border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="loginScreen" class="login-wrap">
  <div class="login-top">
    <button class="iconbtn" id="lgLang">🌐</button>
    <button class="iconbtn" id="lgTheme">🌙</button>
  </div>
  <div class="login-brand">
    <div class="dot"></div>
    <h1 data-t="app_title">ניהול שטיפת רכבים</h1>
    <p>AppNest</p>
  </div>
  <div class="card">
    <label class="field"><span data-t="login_user">שם משתמש או אימייל</span>
      <input id="loginUser" autocomplete="username" data-tph="login_user_ph" /></label>
    <label class="field"><span data-t="login_pass">סיסמה</span>
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" /></label>
    <button id="loginBtn" class="btn gold big" data-t="login_btn">כניסה</button>
    <p id="loginErr" style="text-align:center;margin:12px 0 0;color:var(--red)"></p>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">
  <header class="top">
    <div class="brand"><div class="dot"></div><div>AppNest <small>·</small></div></div>
    <div class="hbtns">
      <button class="iconbtn" id="hLang">🌐</button>
      <button class="iconbtn" id="hTheme">🌙</button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="nav" class="bottom"></nav>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

/* ================= HELPERS ================= */
const GEOFENCE_M=200; // flag "arrived" to the manager if farther than this from the lot
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayStr(){ return ymd(new Date()); }            // LOCAL calendar date, flips at local midnight
function fmtDate(s){ if(!s) return ''; const[y,m,d]=s.split('-'); return `${d}/${m}`; }
function distM(aLat,aLng,bLat,bLng){ // Haversine, metres
  if([aLat,aLng,bLat,bLng].some(x=>x==null)) return null;
  const R=6371000,rad=x=>x*Math.PI/180;
  const dLat=rad(bLat-aLat),dLng=rad(bLng-aLng);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(aLat))*Math.cos(rad(bLat))*Math.sin(dLng/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h)));
}
async function geocode(address){ // free OpenStreetMap geocoding, best-effort, Israel-biased
  try{
    const u=`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=il&q=${encodeURIComponent(address)}`;
    const r=await fetch(u,{headers:{'Accept':'application/json'}}); const j=await r.json();
    if(j&&j[0]) return {lat:+(+j[0].lat).toFixed(6),lng:+(+j[0].lon).toFixed(6)};
  }catch(e){}
  return null;
}
function fmtTime(ts){ if(!ts) return ''; return new Date(ts).toLocaleTimeString(LANG==='he'?'he-IL':LANG,{hour:'2-digit',minute:'2-digit'}); }
function isManager(r){ return ['owner','manager','accountant'].includes(r); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shiftDate(s,n){ const[y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return ymd(dt); }

function getGPS(){ return new Promise(res=>{
  if(!navigator.geolocation){ res(null); return; }
  navigator.geolocation.getCurrentPosition(
    p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)}),
    ()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:0});
});}
function navUrl(l){ return l.lat&&l.lng?`https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}`:`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(l.address||l.name)}`; }
function wazeUrl(l){ return l.lat&&l.lng?`https://waze.com/ul?ll=${l.lat},${l.lng}&navigate=yes`:`https://waze.com/ul?q=${encodeURIComponent(l.address||l.name)}`; }

function compressImage(file,maxDim=1600,q=0.7){ return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{ let{width:w,height:h}=img;
    if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url); c.toBlob(b=>b?resolve(b):reject(new Error('compress')),'image/jpeg',q); };
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('img'));}; img.src=url;
});}

function statusOf(a,hasReport){
  if(a.finished_at) return hasReport?['s-green',T('st_done')]:['s-amber',T('st_missing')];
  if(a.arrived_at) return ['s-blue',T('st_working')];
  if(a.work_date<todayStr()) return ['s-red',T('st_notdone')];
  return ['s-grey',T('st_scheduled')];
}
function roleLabel(r){ return T('role_'+r); }

/* ================= MODAL ================= */
function openModal(inner){
  const back=el(`<div class="modal-back"><div class="modal"><div class="grab"></div></div></div>`);
  back.querySelector('.modal').appendChild(inner);
  back.addEventListener('click',e=>{ if(e.target===back) back.remove(); });
  document.getElementById('modalRoot').appendChild(back); return back;
}

/* ================= AUTH ================= */
async function doLogin(){
  const raw=document.getElementById('loginUser').value.trim();
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginErr'); errEl.textContent='';
  if(!raw||!pass){ errEl.textContent=T('err_empty'); return; }
  const email=raw.includes('@')?raw:(raw.toLowerCase()+EMAIL_SUFFIX);
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  const {error}=await db.auth.signInWithPassword({email,password:pass});
  btn.disabled=false; btn.textContent=T('login_btn');
  if(error){ errEl.textContent=T('err_bad'); return; }
  await boot();
}
async function loadMe(){
  const {data:{user}}=await db.auth.getUser(); if(!user) return null;
  const {data}=await db.from('profiles').select('id,full_name,role').eq('id',user.id).single();
  return data||{id:user.id,full_name:user.email,role:'employee'};
}
async function boot(){
  ME=await loadMe(); if(!ME){ showLogin(); return; }
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  buildNav(); CURRENT=isManager(ME.role)?'dash':'myday'; render();
}
function showLogin(){ document.getElementById('app').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); }
async function logout(){ await db.auth.signOut(); ME=null; location.reload(); }

/* ================= NAV ================= */
function buildNav(){
  const nav=document.getElementById('nav');
  const items=isManager(ME.role)
    ? [['dash','🗂️','nav_dash'],['lots','📍','nav_lots'],['assign','🗓️','nav_assign'],['emps','👥','nav_emps'],['reports','📊','nav_reports'],['settings','⚙️','nav_settings']]
    : [['myday','📋','nav_myday'],['settings','⚙️','nav_settings']];
  nav.innerHTML='';
  items.forEach(([id,ic,k])=>{ const b=el(`<button data-id="${id}"><span class="ic">${ic}</span><span>${T(k)}</span></button>`);
    b.onclick=()=>{ CURRENT=id; render(); }; nav.appendChild(b); });
}
function markNav(){ document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===CURRENT)); }

/* ================= RENDER ROUTER ================= */
async function render(){
  markNav();
  const v=document.getElementById('view'); v.innerHTML='<div class="empty"><span class="spin"></span></div>';
  try{
    if(CURRENT==='dash') await renderDash(v);
    else if(CURRENT==='lots') await renderLots(v);
    else if(CURRENT==='assign') await renderAssign(v);
    else if(CURRENT==='emps') await renderEmps(v);
    else if(CURRENT==='reports') await renderReports(v);
    else if(CURRENT==='myday') await renderMyDay(v);
    else if(CURRENT==='settings') renderSettings(v);
  }catch(e){ v.innerHTML=`<div class="empty">${T('loading_err')}<br><span class="muted">${esc(e.message||'')}</span></div>`; }
}

/* ================= MANAGER · DASHBOARD ================= */
async function renderDash(v){
  const [{data:asgs},{data:reports}]=await Promise.all([
    db.from('assignments').select('*, lots(name,address,region,lat,lng)').eq('work_date',SEL_DATE).order('created_at'),
    db.from('lot_reports').select('*').eq('work_date',SEL_DATE)]);
  const empMap=await employeeMap();
  const repByLot={}; (reports||[]).forEach(r=>repByLot[r.lot_id]=r);
  const byLot={}; (asgs||[]).forEach(a=>{ (byLot[a.lot_id]=byLot[a.lot_id]||{lot:a.lots,rows:[]}).rows.push(a); });
  const redCount=(asgs||[]).filter(a=>!a.finished_at&&a.work_date<todayStr()).length;
  v.innerHTML=`<h2 class="screen-title">${T('dash_title')}</h2>
    <div class="card row between">
      <button class="btn ghost" style="width:auto" id="prevD">‹</button>
      <div style="text-align:center"><div style="font-weight:800">${SEL_DATE===todayStr()?T('today')+' · ':''}${SEL_DATE}</div>
        <div class="muted" style="font-size:12px">${(asgs||[]).length} ${T('u_assignments')} · ${Object.keys(byLot).length} ${T('u_lots')}</div></div>
      <button class="btn ghost" style="width:auto" id="nextD">›</button></div>
    ${redCount?`<div class="card" style="border-color:rgba(239,68,68,.4)"><span class="pill s-red">${redCount} ${T('red_alert')}</span></div>`:''}
    <div id="lotList"></div>`;
  v.querySelector('#prevD').onclick=()=>{ SEL_DATE=shiftDate(SEL_DATE,-1); render(); };
  v.querySelector('#nextD').onclick=()=>{ SEL_DATE=shiftDate(SEL_DATE,1); render(); };
  const list=v.querySelector('#lotList');
  if(!Object.keys(byLot).length){ list.innerHTML=`<div class="empty">${T('dash_empty')}</div>`; return; }
  for(const lotId in byLot){
    const {lot,rows}=byLot[lotId], rep=repByLot[lotId];
    const c=el('<div class="card"></div>');
    c.innerHTML=`<div class="row between"><h3 style="margin:0">${esc(lot?.name||'')}</h3><span class="muted" style="font-size:12px">${esc(lot?.region||'')}</span></div>
      <div class="stack" style="margin-top:8px">
        ${rows.map(a=>{ const[cls,txt]=statusOf(a,!!rep);
          const d=a.arrived_at?distM(a.arrived_lat,a.arrived_lng,lot?.lat,lot?.lng):null; const far=(d!=null&&d>GEOFENCE_M);
          return `<div class="row between">
            <span class="row" style="gap:6px">${esc(empMap[a.employee_id]||T('role_employee'))}${far?`<span class="pill s-amber">⚠︎ ${T('far_flag')} ${d}m</span>`:''}</span>
            <span class="row" style="gap:8px">${a.arrived_at?`<span class="muted" style="font-size:11px">${fmtTime(a.arrived_at)}${a.finished_at?'–'+fmtTime(a.finished_at):''}</span>`:''}
            <span class="pill ${cls}">${txt}</span>
            <button class="btn ghost" style="width:auto;padding:4px 9px" data-del="${a.id}">🗑️</button></span></div>`; }).join('')}
      </div>
      ${rep?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
        <div class="row between"><span>🚗 ${rep.cars_washed} ${T('u_cars')} · ✨ ${rep.preps} ${T('u_preps')}</span>
        ${rep.photo_path?`<button class="btn ghost" style="width:auto" data-photo="${esc(rep.photo_path)}">📄 ${T('btn_doc')}</button>`:''}</div>
        ${rep.note?`<div class="muted" style="font-size:13px;margin-top:8px">📝 ${esc(rep.note)}</div>`:''}</div>`:''}`;
    const pb=c.querySelector('[data-photo]'); if(pb) pb.onclick=()=>viewPhoto(pb.dataset.photo,rep.note);
    c.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!confirm(T('del_confirm'))) return;
      const {error}=await db.from('assignments').delete().eq('id',b.dataset.del);
      if(error){ toast(T('err_generic')+error.message); return; } toast(T('toast_deleted')); render(); });
    list.appendChild(c);
  }
}
async function viewPhoto(path,note){
  const {data,error}=await db.storage.from('documents').createSignedUrl(path,3600);

function lotForm(existing){
  const R=[['',T('choose')],['north',T('r_north')],['haifa',T('r_haifa')],['sharon',T('r_sharon')],['center',T('r_center')],['jlm',T('r_jlm')],['south',T('r_south')]];
  let coords=existing&&existing.lat!=null&&existing.lng!=null?{lat:existing.lat,lng:existing.lng}:null;
  const f=el(`<div><h3>${existing?T('edit_lot_title'):T('lotform_title')}</h3>
    <label class="field"><span>${T('f_lotname')}</span><input id="l_name" value="${existing?esc(existing.name):''}"/></label>
    <label class="field"><span>${T('f_client')}</span><input id="l_client" value="${existing?esc(existing.client_name||''):''}"/></label>
    <label class="field"><span>${T('f_region')}</span><select id="l_region">${R.map(([v,l])=>`<option value="${v}" ${existing&&existing.region===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="field"><span>${T('f_address')}</span><input id="l_addr" value="${existing?esc(existing.address||''):''}"/></label>
    <button class="btn ghost" id="l_here" style="margin-bottom:6px">${coords?T('loc_ok'):T('btn_here')}</button>
    <div class="muted" style="font-size:12px;margin-bottom:12px">${T('geo_hint')}</div>
    <button class="btn gold big" id="l_save">${T('btn_save_lot')}</button>
    ${existing?`<button class="btn danger" id="l_del" style="margin-top:10px">${T('btn_delete')}</button>`:''}</div>`);
  const back=openModal(f);
  f.querySelector('#l_here').onclick=async(e)=>{ const b=e.target; b.innerHTML='<span class="spin"></span>';
    const g=await getGPS(); if(g){ coords=g; b.textContent=T('loc_ok'); } else { b.textContent=T('btn_here'); toast('GPS ✕'); } };
  f.querySelector('#l_save').onclick=async(e)=>{
    const name=f.querySelector('#l_name').value.trim(); if(!name){ toast(T('err_no_lotname')); return; }
    const addr=f.querySelector('#l_addr').value.trim();
    const b=e.target; b.disabled=true; b.innerHTML='<span class="spin"></span>';
    let lat=coords?.lat, lng=coords?.lng;
    if((lat==null||lng==null)&&addr){ const g=await geocode(addr); if(g){ lat=g.lat; lng=g.lng; } }
    const payload={name,client_name:f.querySelector('#l_client').value.trim(),region:f.querySelector('#l_region').value,address:addr,lat,lng};
    const res=existing?await db.from('lots').update(payload).eq('id',existing.id):await db.from('lots').insert(payload);
    if(res.error){ toast(T('err_generic')+res.error.message); b.disabled=false; b.textContent=T('btn_save_lot'); return; }
    back.remove(); toast(existing?T('toast_saved'):T('toast_lot_added')); render();
  };
  if(existing) f.querySelector('#l_del').onclick=async()=>{ if(!confirm(T('del_lot_confirm'))) return;
    const {error}=await db.from('lots').delete().eq('id',existing.id);
    if(error){ toast(T('err_generic')+error.message); return; } back.remove(); toast(T('toast_deleted')); render(); };
}

let REP_FROM=todayStr(), REP_TO=todayStr();
async function renderReports(v){
  const [{data:reports},{data:asgs},empMap]=await Promise.all([
    db.from('lot_reports').select('*, lots(name,client_name)').gte('work_date',REP_FROM).lte('work_date',REP_TO),
    db.from('assignments').select('employee_id,lot_id,work_date,finished_at').gte('work_date',REP_FROM).lte('work_date',REP_TO),
    employeeMap()]);
  const byLot={},byEmp={}; let totCars=0,totPreps=0;
  (reports||[]).forEach(r=>{ const k=r.lot_id; (byLot[k]=byLot[k]||{name:r.lots?.name||'',cars:0,preps:0,days:new Set()});
    byLot[k].cars+=r.cars_washed; byLot[k].preps+=r.preps; byLot[k].days.add(r.work_date); totCars+=r.cars_washed; totPreps+=r.preps; });
  (asgs||[]).forEach(a=>{ if(!a.finished_at) return; (byEmp[a.employee_id]=byEmp[a.employee_id]||{days:new Set(),lots:new Set()});

       <label class="field" style="flex:1;margin:0"><span>${T('f_to')}</span><input type="date" id="r_to" value="${REP_TO}"/></label></div>
     <div class="row" style="gap:8px;margin-top:10px"><button class="btn ghost" id="q_today">${T('today')}</button><button class="btn ghost" id="q_week">${T('q_week')}</button><button class="btn ghost" id="q_month">${T('q_month')}</button></div>
   </div>
   <div class="card"><div class="row between"><span style="font-weight:800">${T('rep_total')}</span><span style="font-weight:800">🚗 ${totCars} · ✨ ${totPreps}</span></div></div>
   <div class="card"><h3>${T('rep_by_lot')}</h3>${Object.keys(byLot).length?Object.values(byLot).map(l=>`<div class="row between" style="padding:6px 0"><span>${esc(l.name)} <span class="muted" style="font-size:12px">(${l.days.size} ${T('u_days')})</span></span><span>🚗 ${l.cars} · ✨ ${l.preps}</span></div>`).join(''):`<div class="muted">${T('rep_empty')}</div>`}</div>
   <div class="card"><h3>${T('rep_by_emp')}</h3>${Object.keys(byEmp).length?Object.entries(byEmp).map(([id,e])=>`<div class="row between" style="padding:6px 0"><span>${esc(empMap[id]||T('role_employee'))}</span><span class="muted" style="font-size:13px">${e.days.size} ${T('u_days')} · ${e.lots.size} ${T('u_lots')}</span></div>`).join(''):`<div class="muted">${T('rep_empty')}</div>`}<div class="muted" style="font-size:11px;margin-top:8px">${T('emp_cars_note')}</div></div>
   <button class="btn gold" id="r_csv">${T('btn_export')}</button>`;
  const rerun=()=>{ REP_FROM=v.querySelector('#r_from').value; REP_TO=v.querySelector('#r_to').value; render(); };
  v.querySelector('#r_from').onchange=rerun; v.querySelector('#r_to').onchange=rerun;
  v.querySelector('#q_today').onclick=()=>{ REP_FROM=REP_TO=todayStr(); render(); };
  v.querySelector('#q_week').onclick=()=>{ REP_TO=todayStr(); REP_FROM=shiftDate(todayStr(),-6); render(); };
  v.querySelector('#q_month').onclick=()=>{ REP_TO=todayStr(); REP_FROM=shiftDate(todayStr(),-29); render(); };
  v.querySelector('#r_csv').onclick=()=>exportCSV(reports||[],empMap);
}
function exportCSV(reports,empMap){
  const head=['date','lot','client','cars_washed','preps','submitted_by','note'];
  const rows=reports.map(r=>[r.work_date,r.lots?.name||'',r.lots?.client_name||'',r.cars_washed,r.preps,empMap[r.submitted_by]||'',(r.note||'').replace(/\n/g,' ')]);
  const csv='\uFEFF'+[head,...rows].map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`carwash_${REP_FROM}_${REP_TO}.csv`; a.click(); URL.revokeObjectURL(url);
}

function jobModal(a,isToday){
  const lot=a.lots||{}, arrived=!!a.arrived_at, finished=!!a.finished_at;
  const canArrive=isToday&&!arrived, canFinish=isToday&&arrived&&!finished;
  const m=el(`<div><h3>${esc(lot.name||'')}</h3><div class="muted" style="margin-bottom:14px">${esc(lot.address||lot.region||'')}</div>
    ${!isToday?`<div class="card" style="border-color:rgba(245,158,11,.4);text-align:center">🔒 ${T('only_today')}</div>`:''}
    <div class="stack">
      <button class="btn big" id="nav">${T('btn_nav')}</button>
      <a class="btn ghost" id="waze" target="_blank" rel="noopener">${T('btn_waze')}</a>
      <button class="btn ${canArrive?'gold':'ghost'} big" id="arrive" ${canArrive?'':'disabled'}>${arrived?'✓ '+T('arrived_at')+fmtTime(a.arrived_at):T('btn_arrived')}</button>
      <button class="btn ${canFinish?'gold':'ghost'} big" id="finish" ${canFinish?'':'disabled'}>${finished?'✓ '+T('finished_at')+fmtTime(a.finished_at):T('btn_finish')}</button>
    </div></div>`);
  const back=openModal(m);
  m.querySelector('#nav').onclick=()=>window.open(navUrl(lot),'_blank');
  m.querySelector('#waze').href=wazeUrl(lot);
  if(canArrive) m.querySelector('#arrive').onclick=async(e)=>{ const btn=e.target; btn.disabled=true; btn.innerHTML='<span class="spin"></span> '+T('reading_loc');
    const g=await getGPS(); const {error}=await db.from('assignments').update({arrived_at:new Date().toISOString(),arrived_lat:g?.lat,arrived_lng:g?.lng}).eq('id',a.id);
    if(error){ toast(T('err_generic')+error.message); btn.disabled=false; btn.textContent=T('btn_arrived'); return; }
    toast(T('toast_arrived')); back.remove(); render(); };
  if(canFinish) m.querySelector('#finish').onclick=()=>{ back.remove(); finishForm(a); };
}
function finishForm(a){
  const f=el(`<div><h3>${T('finish_title')} · ${esc(a.lots?.name||'')}</h3>
    <label class="field"><span>${T('f_photo')}</span><input type="file" id="f_photo" accept="image/*" capture="environment"/></label>
    <img id="f_prev" class="thumb hidden"/>
    <label class="field"><span>${T('f_cars')}</span>${stepperHTML('f_cars')}</label>
    <label class="field"><span>${T('f_preps')}</span>${stepperHTML('f_preps')}</label>
    <label class="field"><span>${T('f_note')}</span><textarea id="f_note" rows="2" placeholder="${T('f_note_ph')}"></textarea></label>
    <button class="btn gold big" id="f_save">${T('btn_send_finish')}</button></div>`);
  const back=openModal(f); bindStepper(f,'f_cars'); bindStepper(f,'f_preps');
  let photoFile=null; const prev=f.querySelector('#f_prev');
  f.querySelector('#f_photo').onchange=e=>{ photoFile=e.target.files[0]||null; if(photoFile){ prev.src=URL.createObjectURL(photoFile); prev.classList.remove('hidden'); } };
  f.querySelector('#f_save').onclick=async(e)=>{
    if(!photoFile){ toast(T('err_photo')); return; }
    const btn=e.target; btn.disabled=true; btn.innerHTML='<span class="spin"></span> '+T('sending');
    try{
      const blob=await compressImage(photoFile);
      const path=`${a.lot_id}/${a.work_date}/${Date.now()}.jpg`;
      const up=await db.storage.from('documents').upload(path,blob,{contentType:'image/jpeg',upsert:false}); if(up.error) throw up.error;
      const cars=+f.querySelector('#f_cars').value||0, preps=+f.querySelector('#f_preps').value||0;
      const rep=await db.from('lot_reports').upsert({lot_id:a.lot_id,work_date:a.work_date,cars_washed:cars,preps:preps,photo_path:path,note:f.querySelector('#f_note').value.trim(),submitted_by:ME.id,submitted_at:new Date().toISOString()},{onConflict:'lot_id,work_date'}); if(rep.error) throw rep.error;
      const g=await getGPS();
      const fin=await db.from('assignments').update({finished_at:new Date().toISOString(),finished_lat:g?.lat,finished_lng:g?.lng}).eq('id',a.id); if(fin.error) throw fin.error;
      back.remove(); toast(T('toast_sent')); render();
    }catch(err){ toast(T('err_generic')+(err.message||'')); btn.disabled=false; btn.textContent=T('btn_send_finish'); }
  };
}
function stepperHTML(id){ return `<div class="stepper"><button type="button" data-step="-1" data-for="${id}">−</button><input id="${id}" type="number" inputmode="numeric" value="0" min="0"/><button type="button" data-step="1" data-for="${id}">＋</button></div>`; }
function bindStepper(root,id){ root.querySelectorAll(`[data-for="${id}"]`).forEach(b=>b.onclick=()=>{ const inp=root.querySelector('#'+id); inp.value=Math.max(0,(+inp.value||0)+ +b.dataset.step); }); }
