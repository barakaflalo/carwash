<style>
  :root{
    --bg:#0a0a0b; --surface:#141416; --surface2:#1c1c20; --line:#2a2a30;
    --text:#f5f5f2; --muted:#9a9aa2; --gold:#d4af37; --gold-soft:#b8952e;
    --grey:#6b7280; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
    --radius:16px;
  }
  html[data-theme="light"]{
    --bg:#f4f2ec; --surface:#ffffff; --surface2:#f0eee7; --line:#e3e0d6;
    --text:#1a1a1d; --muted:#6b6b72; --gold:#a9822a; --gold-soft:#8f6d1f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew","Noto Sans Arabic",Arial,sans-serif;
    line-height:1.5;overscroll-behavior-y:none}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  .hidden{display:none !important}

  .app{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  header.top{display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px calc(12px + env(safe-area-inset-top));
    position:sticky;top:0;background:linear-gradient(180deg,var(--bg),rgba(10,10,11,.0));
    backdrop-filter:blur(8px);z-index:20;border-bottom:1px solid var(--line)}
  html[data-theme="light"] header.top{background:var(--bg)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800}
  .brand .dot{width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--gold),var(--gold-soft));
    box-shadow:0 0 0 3px rgba(212,175,55,.15)}
  .brand small{color:var(--gold)}
  .hbtns{display:flex;gap:8px}
  .iconbtn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);
    background:var(--surface);color:var(--text);font-size:18px;display:flex;align-items:center;justify-content:center}
  main{flex:1;padding:16px 16px 150px}
  h2.screen-title{font-size:20px;margin:4px 2px 14px}
  .muted{color:var(--muted)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:15px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .stack{display:flex;flex-direction:column;gap:10px}

  label.field{display:block;margin-bottom:12px}
  label.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input,select,textarea{width:100%;padding:13px 14px;background:var(--surface2);border:1px solid var(--line);
    color:var(--text);border-radius:12px;font-size:16px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--gold)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;
    border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:15px;font-weight:600;width:100%}
  .btn.gold{background:linear-gradient(180deg,var(--gold),var(--gold-soft));color:#1a1400;border:none}
  .btn.big{padding:20px;font-size:19px;font-weight:800}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--red);border-color:rgba(239,68,68,.4)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5}

  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
  .s-grey{color:var(--grey);background:rgba(107,114,128,.16)}
  .s-blue{color:var(--blue);background:rgba(59,130,246,.16)}
  .s-green{color:var(--green);background:rgba(34,197,94,.16)}
  .s-red{color:var(--red);background:rgba(239,68,68,.16)}
  .s-amber{color:var(--amber);background:rgba(245,158,11,.16)}

  nav.bottom{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;
    background:var(--surface);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);z-index:20}
  nav.bottom button{flex:0 0 25%;background:none;border:none;color:var(--muted);padding:9px 2px 10px;font-size:11px;
    display:flex;flex-direction:column;align-items:center;gap:3px}
  nav.bottom button .ic{font-size:19px}
  nav.bottom button.active{color:var(--gold)}

  .login-wrap{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px;max-width:420px;margin:0 auto}
  .login-brand{text-align:center;margin-bottom:24px}
  .login-brand .dot{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,var(--gold),var(--gold-soft));box-shadow:0 0 0 4px rgba(212,175,55,.15)}
  .login-brand h1{margin:0;font-size:23px}
  .login-brand p{margin:6px 0 0;color:var(--gold);font-weight:700;font-size:14px}
  .login-top{display:flex;justify-content:center;gap:8px;margin-bottom:18px}

  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:40}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:760px;
    padding:20px;max-height:92dvh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom));position:relative}
  .modal h3{margin:0 0 14px;font-size:18px}
  .modal .grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
  .modal-x{position:absolute;top:12px;inset-inline-end:12px;width:34px;height:34px;border-radius:50%;
    border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:15px;line-height:1;z-index:2}

  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .stepper button{width:56px;height:52px;background:var(--surface2);border:none;color:var(--gold);font-size:24px}
  .stepper input{text-align:center;border:none;border-radius:0;border-inline:1px solid var(--line);font-size:20px;font-weight:800}

  .langrow{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);margin-bottom:8px;font-size:16px}
  .langrow.active{border-color:var(--gold)}

  #toast{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--line);
    color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
  #toast.show{opacity:1}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .thumb{width:100%;border-radius:12px;margin-top:8px;border:1px solid var(--line)}
  .badge{text-align:center;color:var(--muted);font-size:11px;margin-top:22px}
  .spin{width:18px;height:18px;border:2px solid rgba(150,150,150,.4);border-top-color:var(--gold);border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important} }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="loginScreen" class="login-wrap">
  <div class="login-top">
    <button class="iconbtn" id="lgShare">📤</button>
    <button class="iconbtn" id="lgLang">🌐</button>
    <button class="iconbtn" id="lgTheme">🌙</button>
  </div>
  <div class="login-brand">
    <div class="dot"></div>
    <h1 data-t="app_title">ניהול שטיפת רכבים</h1>
    <p>AppNest</p>
  </div>
  <div class="card">
    <label class="field"><span data-t="login_user">שם משתמש או אימייל</span>
      <input id="loginUser" autocomplete="username" data-tph="login_user_ph" /></label>
    <label class="field"><span data-t="login_pass">סיסמה</span>
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" /></label>
    <button id="loginBtn" class="btn gold big" data-t="login_btn">כניסה</button>
    <p id="loginErr" style="text-align:center;margin:12px 0 0;color:var(--red)"></p>
  </div>
</section>

<!-- ============ LOCK ============ -->
<section id="lockScreen" class="login-wrap hidden">
  <div class="login-brand"><div class="dot"></div><h1 data-t="lock_title">הזן קוד</h1></div>
  <div class="card">
    <input id="pinInput" type="password" inputmode="numeric" placeholder="••••" style="text-align:center;font-size:24px;letter-spacing:8px" />
    <button id="pinBtn" class="btn gold big" style="margin-top:12px" data-t="lock_unlock">פתח</button>
    <p id="pinErr" style="text-align:center;color:var(--red);margin:10px 0 0"></p>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">
  <header class="top">
    <div class="brand"><div class="dot"></div><div>AppNest <small>·</small></div></div>
    <div class="hbtns">
      <button class="iconbtn" id="hShare">📤</button>
      <button class="iconbtn" id="hLang">🌐</button>
      <button class="iconbtn" id="hTheme">🌙</button>
    </div>
  </header>
  <main id="view"></main>
  <nav id="nav" class="bottom"></nav>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

const GEOFENCE_M=200; // flag "arrived" to the manager if farther than this from the lot
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayStr(){ return ymd(new Date()); }            // LOCAL calendar date, flips at local midnight
function fmtDate(s){ if(!s) return ''; const[y,m,d]=s.split('-'); return `${d}/${m}`; }
function distM(aLat,aLng,bLat,bLng){ // Haversine, metres
  if([aLat,aLng,bLat,bLng].some(x=>x==null)) return null;
  const R=6371000,rad=x=>x*Math.PI/180;
  const dLat=rad(bLat-aLat),dLng=rad(bLng-aLng);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(aLat))*Math.cos(rad(bLat))*Math.sin(dLng/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h)));
}
function distLabel(m){ if(m==null) return ''; return m>=1000 ? (m/1000).toFixed(1)+' '+T('u_km') : m+' '+T('u_m'); }
async function geocode(address){ // free OpenStreetMap geocoding, best-effort, Israel-biased
  try{
    const u=`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=il&q=${encodeURIComponent(address)}`;
    const r=await fetch(u,{headers:{'Accept':'application/json'}}); const j=await r.json();
    if(j&&j[0]) return {lat:+(+j[0].lat).toFixed(6),lng:+(+j[0].lon).toFixed(6)};
  }catch(e){}
  return null;
}
async function revGeocode(lat,lng){ // point -> address, best-effort (may fail silently)
  try{
    const u=`https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&lat=${lat}&lon=${lng}`;
    const r=await fetch(u,{headers:{'Accept':'application/json'}}); const j=await r.json();
    if(j&&j.display_name) return j.display_name;
  }catch(e){}
  return null;
}
function fmtTime(ts){ if(!ts) return ''; return new Date(ts).toLocaleTimeString(LANG==='he'?'he-IL':LANG,{hour:'2-digit',minute:'2-digit'}); }
function isManager(r){ return ['owner','manager','accountant'].includes(r); }
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shiftDate(s,n){ const[y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return ymd(dt); }

function getGPS(){ return new Promise(res=>{
  if(!navigator.geolocation){ res(null); return; }
  navigator.geolocation.getCurrentPosition(
    p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)}),
    ()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:0});
});}
function navUrl(l){ return l.lat&&l.lng?`https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}`:`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(l.address||l.name)}`; }
function wazeUrl(l){ return l.lat&&l.lng?`https://waze.com/ul?ll=${l.lat},${l.lng}&navigate=yes`:`https://waze.com/ul?q=${encodeURIComponent(l.address||l.name)}`; }

function compressImage(file,maxDim=1600,q=0.7){ return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{ let{width:w,height:h}=img;
    if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url); c.toBlob(b=>b?resolve(b):reject(new Error('compress')),'image/jpeg',q); };
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('img'));}; img.src=url;
});}

function statusOf(a){ // an employee's PERSONAL attendance status
  if(a.finished_at) return ['s-green',T('st_done')];
  if(a.arrived_at) return ['s-blue',T('st_working')];
  if(a.work_date<todayStr()) return ['s-red',T('st_absent')];
  return ['s-grey',T('st_scheduled')];
}

  return ['s-grey',T('st_scheduled')];
}

/* ================= OFFLINE QUEUE (IndexedDB outbox) ================= */
const IDB_NAME='carwash_q', IDB_STORE='queue';
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE,{keyPath:'id',autoIncrement:true}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function qAdd(rec){ const d=await idb(); return new Promise((res,rej)=>{ const tx=d.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).add(rec); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
async function qAll(){ try{ const d=await idb(); return await new Promise(res=>{ const tx=d.transaction(IDB_STORE,'readonly'); const rq=tx.objectStore(IDB_STORE).getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>res([]); }); }catch(_){ return []; } }
async function qDel(id){ try{ const d=await idb(); await new Promise(res=>{ const tx=d.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).delete(id); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }); }catch(_){} }
function isNetErr(e){ return !navigator.onLine || (e && /fetch|network|failed to send|timeout|load failed/i.test(e.message||String(e))); }

async function processRecord(r){
  if(r.type==='arrive'){
    const {error}=await db.from('assignments').update({arrived_at:r.arrived_at,arrived_lat:r.lat,arrived_lng:r.lng}).eq('id',r.assignment_id);
    if(error) throw error;
  } else if(r.type==='endshift'){
    const {error}=await db.from('assignments').update({finished_at:r.finished_at,finished_lat:r.lat,finished_lng:r.lng}).eq('id',r.assignment_id);
    if(error) throw error;
  } else if(r.type==='setloc'){
    const patch={lat:r.lat,lng:r.lng}; if(r.address) patch.address=r.address;
    const {error}=await db.from('lots').update(patch).eq('id',r.lot_id);
    if(error) throw error;
  } else if(r.type==='finish'){
    if(r.photoBlob){ const up=await db.storage.from('documents').upload(r.path,r.photoBlob,{contentType:'image/jpeg',upsert:true}); if(up.error) throw up.error;
      const doc=await db.from('lot_documents').insert({lot_id:r.lot_id,work_date:r.work_date,photo_path:r.path,submitted_by:r.submitted_by}); if(doc.error) throw doc.error; }
    const rep=await db.from('lot_reports').upsert({lot_id:r.lot_id,work_date:r.work_date,cars_washed:r.cars,preps:r.preps,photo_path:r.path,note:r.note,submitted_by:r.submitted_by,submitted_at:r.submitted_at},{onConflict:'lot_id,work_date'}); if(rep.error) throw rep.error;
    const fin=await db.from('assignments').update({finished_at:r.finished_at,finished_lat:r.lat,finished_lng:r.lng}).eq('id',r.assignment_id); if(fin.error) throw fin.error;
  }
}
/* run an action now if online, otherwise stash it in the outbox. returns 'sent' | 'queued' | throws */
async function submitAction(rec){
  try{ if(!navigator.onLine) throw new Error('offline'); await processRecord(rec); return 'sent'; }
  catch(e){ if(isNetErr(e)){ await qAdd(rec); return 'queued'; } throw e; }
}
let flushing=false;
async function flushQueue(silent){
  if(flushing||!navigator.onLine) return 0;
  flushing=true; const items=await qAll(); let sent=0;
  for(const r of items){ try{ await processRecord(r); await qDel(r.id); sent++; }
    catch(e){ if(isNetErr(e)) break; else { await qDel(r.id); } } }  // drop permanently-failing records
  flushing=false;
  if(sent){ if(!silent) toast(T('toast_synced')); if(ME) render(); }
  return sent;
}
async function pendingSet(){ const items=await qAll(); return new Set(items.map(r=>r.assignment_id)); }
async function pendingCount(){ return (await qAll()).length; }
/* overlay queued (offline) actions onto the assignments so the worker can keep going */
async function applyQueue(asgs){
  const items=await qAll(); const pend=new Set(); const byId={}; asgs.forEach(a=>byId[a.id]=a);
  items.forEach(r=>{ const a=byId[r.assignment_id]; if(!a) return; pend.add(a.id);
    if(r.type==='arrive'){ if(!a.arrived_at){ a.arrived_at=r.arrived_at; a.arrived_lat=r.lat; a.arrived_lng=r.lng; } }
    else if(r.type==='endshift'||r.type==='finish'){ if(!a.arrived_at) a.arrived_at=r.finished_at; if(!a.finished_at){ a.finished_at=r.finished_at; a.finished_lat=r.lat; a.finished_lng=r.lng; } }
  });
  return pend;
}
window.addEventListener('online',()=>flushQueue(false));

function openModal(inner){
  const back=el(`<div class="modal-back"><div class="modal"><button class="modal-x" aria-label="close">✕</button><div class="grab"></div></div></div>`);
  back.querySelector('.modal').appendChild(inner);
  back.querySelector('.modal-x').addEventListener('click',()=>back.remove());
  back.addEventListener('click',e=>{ if(e.target===back) back.remove(); });
  document.getElementById('modalRoot').appendChild(back); return back;
}

/* ================= AUTH ================= */
async function doLogin(){
  const raw=document.getElementById('loginUser').value.trim();
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginErr'); errEl.textContent='';
  if(!raw||!pass){ errEl.textContent=T('err_empty'); return; }
  const email=raw.includes('@')?raw:(raw.toLowerCase()+EMAIL_SUFFIX);
  const btn=document.getElementById('loginBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  const {error}=await db.auth.signInWithPassword({email,password:pass});
  btn.disabled=false; btn.textContent=T('login_btn');
  if(error){ errEl.textContent=T('err_bad'); return; }
  await boot();
}
async function loadMe(){
  const {data:{user}}=await db.auth.getUser(); if(!user) return null;
  const {data,error}=await db.from('profiles').select('id,full_name,role,lock_pin').eq('id',user.id).single();
  if(!error&&data){ try{ localStorage.setItem('cw_me',JSON.stringify(data)); }catch(_){} return data; }
  try{ const c=JSON.parse(localStorage.getItem('cw_me')||'null'); if(c&&c.id===user.id) return c; }catch(_){}
  return {id:user.id,full_name:user.email,role:'employee'};
}
async function boot(){
  ME=await loadMe(); if(!ME){ showLogin(); return; }
  if(ME.lock_pin){ showLockThen(afterUnlock); } else afterUnlock();
}
function afterUnlock(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('lockScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  buildNav(); CURRENT=isManager(ME.role)?'dash':'myday'; render(); flushQueue(true); maybeOnboard();
  if(isManager(ME.role)) generateFromTemplates(false);
}
function showLockThen(cb){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.add('hidden');
  const ls=document.getElementById('lockScreen'); ls.classList.remove('hidden');
  const inp=document.getElementById('pinInput'), btn=document.getElementById('pinBtn'), err=document.getElementById('pinErr');
  inp.value='';
  const go=async()=>{ err.textContent=''; if(await sha(inp.value)===ME.lock_pin){ ls.classList.add('hidden'); cb(); } else { err.textContent=T('lock_wrong'); inp.value=''; } };
  btn.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); }; setTimeout(()=>inp.focus(),100);
}
function maybeOnboard(){ if(!localStorage.getItem('cw_onboarded')) showGuide(); }
function showLogin(){ document.getElementById('app').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); }
async function logout(){ await db.auth.signOut(); localStorage.removeItem('cw_me'); ME=null; location.reload(); }

    ? [['dash','🗂️','nav_dash'],['weekly','🧽','nav_weekly'],['lots','📍','nav_lots'],['assign','🗓️','nav_assign'],['emps','👥','nav_emps'],['reports','📊','nav_reports'],['myday','📋','nav_myday'],['settings','⚙️','nav_settings']]

/* ================= RENDER ROUTER ================= */
async function render(){
  markNav();
  const v=document.getElementById('view'); v.innerHTML='<div class="empty"><span class="spin"></span></div>';
  try{
    if(CURRENT==='dash') await renderDash(v);
    else if(CURRENT==='weekly') await renderWeekly(v);
    else if(CURRENT==='lots') await renderLots(v);
    else if(CURRENT==='assign') await renderAssign(v);
    else if(CURRENT==='emps') await renderEmps(v);
    else if(CURRENT==='reports') await renderReports(v);
    else if(CURRENT==='myday') await renderMyDay(v);
    else if(CURRENT==='settings') renderSettings(v);
  }catch(e){ v.innerHTML=`<div class="empty">${T('loading_err')}<br><span class="muted">${esc(e.message||'')}</span></div>`; }
}

/* ================= PERMANENT SCHEDULE (templates → real assignments) ================= */
const SCHED_HORIZON_DAYS=42; // ~6 weeks generated forward
async function generateFromTemplates(force){
  if(!ME||!isManager(ME.role)) return;
  const today=todayStr();
  if(!force && localStorage.getItem('cw_gen_last')===today) return;
  const horizon=shiftDate(today,SCHED_HORIZON_DAYS);
  const [{data:tpls},{data:emps},{data:existing}]=await Promise.all([
    db.from('schedule_templates').select('employee_id,weekday,lot_id,created_at').order('created_at'),
    db.from('profiles').select('id,unavailable_until').eq('role','employee').is('archived_at',null),
    db.from('assignments').select('id,employee_id,lot_id,work_date,arrived_at,from_template').is('deleted_at',null).gte('work_date',today).lte('work_date',horizon)]);
  if(!tpls||!tpls.length){ localStorage.setItem('cw_gen_last',today); return; }
  const unavail={}; (emps||[]).forEach(e=>{ if(e.unavailable_until) unavail[e.id]=e.unavailable_until; });
  const desired=new Map(); const dayLotEmps={};
  for(let i=0;i<=SCHED_HORIZON_DAYS;i++){ const d=shiftDate(today,i); const wd=new Date(d+'T00:00:00').getDay();
    tpls.filter(t=>t.weekday===wd).forEach(t=>{ if(unavail[t.employee_id]&&unavail[t.employee_id]>=d) return;
      const key=t.employee_id+'|'+t.lot_id+'|'+d; if(!desired.has(key)) desired.set(key,{employee_id:t.employee_id,lot_id:t.lot_id,work_date:d});
      const lk=t.lot_id+'|'+d; (dayLotEmps[lk]=dayLotEmps[lk]||[]).push({employee_id:t.employee_id,created_at:t.created_at||''}); }); }
  const leadOf={}; for(const lk in dayLotEmps){ leadOf[lk]=dayLotEmps[lk].slice().sort((a,b)=>a.created_at.localeCompare(b.created_at))[0].employee_id; }
  const existKeyAll=new Set((existing||[]).map(a=>a.employee_id+'|'+a.lot_id+'|'+a.work_date));
  const toInsert=[]; desired.forEach((v,key)=>{ if(!existKeyAll.has(key)){ const lk=v.lot_id+'|'+v.work_date;
    toInsert.push({lot_id:v.lot_id,employee_id:v.employee_id,work_date:v.work_date,created_by:ME.id,from_template:true,is_lead:leadOf[lk]===v.employee_id}); } });
  const toRemove=(existing||[]).filter(a=>a.from_template && a.work_date>today && !a.arrived_at && !desired.has(a.employee_id+'|'+a.lot_id+'|'+a.work_date)).map(a=>a.id);
  try{
    for(let i=0;i<toInsert.length;i+=400){ await db.from('assignments').insert(toInsert.slice(i,i+400)); }
    for(let i=0;i<toRemove.length;i+=200){ await db.from('assignments').update({deleted_at:new Date().toISOString()}).in('id',toRemove.slice(i,i+200)); }
    localStorage.setItem('cw_gen_last',today);
  }catch(e){ /* best-effort; will retry next open */ }
}
function lotPickerModal(lots,current,onDone){
  const sel=new Set(current);
  const m=el(`<div><h3>${T('add_lot_day')}</h3>
    <input id="lpf" placeholder="🔎" style="margin-bottom:10px"/>
    <div id="lplist" class="stack" style="max-height:52vh;overflow:auto"></div>
    <button class="btn gold big" id="lpok" style="margin-top:12px">${T('btn_save')}</button></div>`);
  const back=openModal(m); const list=m.querySelector('#lplist');
  const paintList=q=>{ list.innerHTML=''; (lots||[]).filter(l=>!q||(l.name||'').toLowerCase().includes(q.toLowerCase())).forEach(l=>{
    const row=el(`<label class="row" style="gap:10px;background:var(--surface2);padding:10px;border-radius:10px;border:1px solid var(--line)"><input type="checkbox" style="width:18px;height:18px" ${sel.has(l.id)?'checked':''}/><span>${esc(l.name)}${l.region?' · '+esc(l.region):''}</span></label>`);
    row.querySelector('input').onchange=e=>{ if(e.target.checked) sel.add(l.id); else sel.delete(l.id); };
    list.appendChild(row); }); };
  paintList(''); m.querySelector('#lpf').oninput=e=>paintList(e.target.value);
  m.querySelector('#lpok').onclick=()=>{ back.remove(); onDone(sel); };
}
async function scheduleModal(empId){
  const [{data:emp},{data:lots},{data:tpls}]=await Promise.all([
    db.from('profiles').select('id,full_name,unavailable_until').eq('id',empId).single(),
    db.from('lots').select('id,name,region').is('deleted_at',null).order('name'),
    db.from('schedule_templates').select('id,weekday,lot_id').eq('employee_id',empId)]);
  const days=[0,1,2,3,4,5]; const sel={}; days.forEach(d=>sel[d]=new Set());
  (tpls||[]).forEach(t=>{ if(sel[t.weekday]) sel[t.weekday].add(t.lot_id); });
  const lotName=id=>((lots||[]).find(l=>l.id===id)||{}).name||'';
  const m=el(`<div><h3>${T('perm_schedule')} · ${esc(emp.full_name||'')}</h3>
    <div class="muted" style="font-size:12px;margin-bottom:12px">👑 ${T('sched_hint')}</div>
    <label class="field"><span>${T('unavailable_until')}</span><input type="date" id="unav" value="${emp.unavailable_until||''}"/></label>
    <div id="days"></div>
    <button class="btn gold big" id="sv" style="margin-top:12px">${T('btn_save')}</button>
    <button class="btn danger" id="delsched" style="margin-top:10px">🗑️ ${T('sched_delete')}</button></div>`);
  const back=openModal(m); const dv=m.querySelector('#days');
  m.querySelector('#delsched').onclick=async(e)=>{ if(!confirm(T('sched_delete_confirm'))) return; const b=e.target; b.disabled=true; b.innerHTML='<span class="spin"></span>';
    try{ await db.from('schedule_templates').delete().eq('employee_id',empId); await generateFromTemplates(true); }
    catch(err){ toast(T('err_generic')+(err.message||'')); b.disabled=false; b.textContent='🗑️ '+T('sched_delete'); return; }
    back.remove(); toast(T('sched_deleted')); render(); };
  const paint=()=>{ dv.innerHTML=''; days.forEach(d=>{
    const card=el(`<div class="card" style="margin:0 0 10px"><div style="font-weight:800;margin-bottom:8px">${dayName(d)}</div><div class="chips"></div>
      <button type="button" class="btn ghost addlot" style="margin-top:8px">＋ ${T('add_lot_day')}</button></div>`);
    const chips=card.querySelector('.chips');
    if(!sel[d].size) chips.innerHTML=`<span class="muted" style="font-size:12px">—</span>`;
    [...sel[d]].forEach(lid=>{ const chip=el(`<span class="pill s-blue" style="cursor:pointer;margin:0 6px 6px 0;display:inline-block">${esc(lotName(lid))} ✕</span>`); chip.onclick=()=>{ sel[d].delete(lid); paint(); }; chips.appendChild(chip); });
    card.querySelector('.addlot').onclick=()=>lotPickerModal(lots,sel[d],ns=>{ sel[d]=ns; paint(); });
    dv.appendChild(card); }); };
  paint();
  m.querySelector('#sv').onclick=async(e)=>{ const b=e.target; b.disabled=true; b.innerHTML='<span class="spin"></span>';
    const unav=m.querySelector('#unav').value||null;
    await db.from('profiles').update({unavailable_until:unav}).eq('id',empId);
    const existing=(tpls||[]); const existKey=new Set(existing.map(t=>t.weekday+'|'+t.lot_id));
    const desired=[]; days.forEach(d=>[...sel[d]].forEach(lid=>desired.push({weekday:d,lot_id:lid})));
    const desiredKey=new Set(desired.map(x=>x.weekday+'|'+x.lot_id));
    const toAdd=desired.filter(x=>!existKey.has(x.weekday+'|'+x.lot_id)).map(x=>({employee_id:empId,weekday:x.weekday,lot_id:x.lot_id,created_by:ME.id}));
    const toDel=existing.filter(t=>!desiredKey.has(t.weekday+'|'+t.lot_id)).map(t=>t.id);
    try{
      if(toAdd.length) await db.from('schedule_templates').insert(toAdd);
      if(toDel.length) await db.from('schedule_templates').delete().in('id',toDel);
      await generateFromTemplates(true);
    }catch(err){ toast(T('err_generic')+(err.message||'')); b.disabled=false; b.textContent=T('btn_save'); return; }
    back.remove(); toast(T('sched_saved')); render();
  };
}

/* ================= MANAGER · WEEKLY TRACKER ================= */
let WEEKLY_REGION='', ASSIGN_LOT='';
function weekStartSat(){ const t=new Date(); t.setHours(0,0,0,0); const diff=(t.getDay()-6+7)%7; t.setDate(t.getDate()-diff); return t; } // most recent Saturday
async function renderWeekly(v){
  const ws=weekStartSat(), we=new Date(ws); we.setDate(ws.getDate()+6);
  const from=ymd(ws), to=ymd(we);
  const [{data:lots},{data:reports},{data:asgs}]=await Promise.all([
    db.from('lots').select('id,name,region,lat,lng').is('deleted_at',null).order('name'),
    db.from('lot_reports').select('lot_id').gte('work_date',from).lte('work_date',to),
    db.from('assignments').select('lot_id,employee_id,work_date,is_lead,arrived_at').is('deleted_at',null).gte('work_date',from).lte('work_date',to)]);
  const empMap=await employeeMap();
  const reported=new Set((reports||[]).map(r=>r.lot_id));
  const arrived=new Set((asgs||[]).filter(a=>a.arrived_at).map(a=>a.lot_id));
  const assigned=new Set((asgs||[]).map(a=>a.lot_id));
  const asgByLot={}; (asgs||[]).forEach(a=>{ (asgByLot[a.lot_id]=asgByLot[a.lot_id]||[]).push(a); });
  const REG=[['',T('all_regions')],['north',T('r_north')],['haifa',T('r_haifa')],['sharon',T('r_sharon')],['center',T('r_center')],['jlm',T('r_jlm')],['south',T('r_south')],['__none__',T('region_none')]];
  let all=(lots||[]); if(WEEKLY_REGION==='__none__') all=all.filter(l=>!l.region); else if(WEEKLY_REGION) all=all.filter(l=>l.region===WEEKLY_REGION);
  const stat=id=> reported.has(id)?'green':(arrived.has(id)?'yellow':'red');
  const g=all.filter(l=>stat(l.id)==='green').length, y=all.filter(l=>stat(l.id)==='yellow').length, r=all.filter(l=>stat(l.id)==='red').length;
  const noAsg=all.filter(l=>!assigned.has(l.id));
  v.innerHTML=`<h2 class="screen-title">${T('nav_weekly')}</h2>
    <div class="card"><div class="muted" style="font-size:12px">${T('week_range')}: ${fmtDate(from)} – ${fmtDate(to)}</div>
      <div class="row between" style="margin-top:8px"><span style="font-weight:800">${T('lots_total')}: ${all.length}</span>
        <span class="row" style="gap:6px"><span class="pill s-green">${g}</span><span class="pill s-amber">${y}</span><span class="pill s-red">${r}</span></span></div></div>
    <label class="field"><span>${T('f_region')}</span><select id="wreg">${REG.map(([val,lab])=>`<option value="${val}" ${WEEKLY_REGION===val?'selected':''}>${lab}</option>`).join('')}</select></label>
    ${noAsg.length?`<div class="card" style="border-color:rgba(239,68,68,.5)"><div style="font-weight:800;color:var(--red);margin-bottom:8px">⚠ ${T('no_assign_week')} (${noAsg.length})</div><div id="noAsgList" class="stack"></div></div>`:''}
    <div id="wkList" class="stack" style="margin-top:6px"></div>`;
  v.querySelector('#wreg').onchange=e=>{ WEEKLY_REGION=e.target.value; render(); };
  const mkLotRow=(l,extraBorder)=>{ const [cls,txt]=stat(l.id)==='green'?['s-green',T('st_done')]:stat(l.id)==='yellow'?['s-amber',T('st_inprogress')]:['s-red',T('st_notdone')];
    const c=el(`<div class="card row between" style="margin:0${extraBorder?';border-color:rgba(239,68,68,.3)':''};cursor:pointer"><span>${esc(l.name)} <span class="muted" style="font-size:12px">${l.region?esc(l.region):''}</span></span><span class="pill ${cls}">${txt}</span></div>`);
    c.onclick=()=>weeklyLotModal(l,asgByLot[l.id]||[],empMap); return c; };
  if(noAsg.length){ const nw=v.querySelector('#noAsgList'); noAsg.forEach(l=>nw.appendChild(mkLotRow(l,true))); }
  const wl=v.querySelector('#wkList'); all.forEach(l=>wl.appendChild(mkLotRow(l,false)));
}

  const m=el(`<div><h3>${esc(lot.name)}</h3><div class="muted" style="font-size:12px;margin-bottom:12px">${lot.region?esc(lot.region):T('region_none')}</div>
    <div style="font-weight:800;margin-bottom:8px">${T('scheduled_this_week')}</div><div class="stack" id="wsched"></div>

  let leadId=null;
  v.querySelectorAll('.a_lead').forEach(b=>b.onclick=()=>{ leadId=(leadId===b.dataset.e)?null:b.dataset.e;
    v.querySelectorAll('.a_lead').forEach(x=>x.classList.toggle('gold',x.dataset.e===leadId)); });
  v.querySelector('#a_save').onclick=async()=>{
    const date=v.querySelector('#a_date').value,lot=v.querySelector('#a_lot').value;
    const chosen=[...v.querySelectorAll('#a_emps .a_ck:checked')].map(i=>i.value);
    if(!date||!lot||!chosen.length){ toast(T('err_assign')); return; }
    const lead=(leadId&&chosen.includes(leadId))?leadId:chosen[0]; // default: first picked
    const dows=[...v.querySelectorAll('.dow.gold')].map(b=>+b.dataset.d);
    const weeks=Math.min(12,Math.max(1,+v.querySelector('#a_weeks').value||1));
    const dates=dows.length?genDates(date,dows,weeks):[date];
    const rows=[]; chosen.forEach(eid=>dates.forEach(dt=>rows.push({lot_id:lot,employee_id:eid,work_date:dt,created_by:ME.id,is_lead:eid===lead})));
    const {error}=await db.from('assignments').insert(rows);
    if(error){ toast(T('err_generic')+error.message); return; }
    toast(`${rows.length} ${T('toast_assigned')}`); SEL_DATE=date; DASH_FROM=DASH_TO=date; DASH_REGION=''; CURRENT='dash'; render();
  };
}
function genDates(start,dows,weeks){ const[y,m,d]=start.split('-').map(Number); const s=new Date(y,m-1,d); const set=new Set(dows); const out=[];
  for(let i=0;i<weeks*7;i++){ const dt=new Date(s); dt.setDate(s.getDate()+i); if(set.has(dt.getDay())) out.push(ymd(dt)); } return out; }

function docName(lotName,date,who){ return `${sanitize(lotName)}_${date}${who?'_'+sanitize(who):''}.jpg`; }
async function fetchDownload(url,filename){ try{ const b=await (await fetch(url)).blob(); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=filename; a.click(); URL.revokeObjectURL(u);}catch(e){ toast(T('err_generic')+(e.message||'')); } }

      openModal(mm); mm.querySelector('[data-dl2]').onclick=()=>fetchDownload(url,fn); };
    cell.querySelector('[data-dl]').onclick=()=>fetchDownload(url,fn);
    grid.appendChild(cell); });
  zipBtn.style.display='';
  zipBtn.onclick=async()=>{ if(typeof JSZip==='undefined'){ toast('ZIP ✕'); return; }
    zipBtn.disabled=true; const orig=zipBtn.textContent; zipBtn.textContent=T('zipping');
    const zip=new JSZip(), used={};
    for(const d of docs){ const url=urlByPath[d.photo_path]; if(!url) continue; let fn=nameFor(d);
      if(used[fn]){ used[fn]++; fn=fn.replace(/\.jpg$/,'_'+used[fn]+'.jpg'); } else used[fn]=1;
      try{ zip.file(fn,await (await fetch(url)).blob()); }catch(_){} }
    const blob=await zip.generateAsync({type:'blob'}); const u=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=u; a.download=`carwash_docs_${REP_FROM}_${REP_TO}.zip`; a.click(); URL.revokeObjectURL(u);
    zipBtn.disabled=false; zipBtn.textContent=orig; };
}
function exportCSV(reports,empMap){
  const head=['date','lot','client','cars_washed','preps','submitted_by','note'];
  const rows=reports.map(r=>[r.work_date,r.lots?.name||'',r.lots?.client_name||'',r.cars_washed,r.preps,empMap[r.submitted_by]||'',(r.note||'').replace(/\n/g,' ')]);
  const csv='\uFEFF'+[head,...rows].map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`carwash_${REP_FROM}_${REP_TO}.csv`; a.click(); URL.revokeObjectURL(url);
}

/* ================= PIN LOCK + RECYCLE BIN + START ================= */
async function sha(s){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function hasPin(){ return !!(ME&&ME.lock_pin); }
function setPinFlow(){ const f=el(`<div><h3>${T('lock_on')}</h3><label class="field"><span>${T('lock_new')}</span><input id="np" type="password" inputmode="numeric"/></label><button class="btn gold big" id="sv">${T('btn_save')}</button></div>`);
  const back=openModal(f); f.querySelector('#sv').onclick=async(e)=>{ const p=f.querySelector('#np').value.trim(); if(p.length<4){ toast(T('lock_new')); return; }
    const b=e.target; b.disabled=true; b.innerHTML='<span class="spin"></span>'; const h=await sha(p);
    const {error}=await db.functions.invoke('create-employee',{body:{action:'set_lock',pin_hash:h}});
    if(error){ toast(T('err_generic')+(error.message||'')); b.disabled=false; b.textContent=T('btn_save'); return; }
    ME.lock_pin=h; try{ localStorage.setItem('cw_me',JSON.stringify(ME)); }catch(_){} back.remove(); toast(T('toast_lock_on')); render(); }; }
function removePinFlow(){ const f=el(`<div><h3>${T('lock_on')}</h3><label class="field"><span>${T('lock_current')}</span><input id="cp" type="password" inputmode="numeric"/></label><button class="btn danger" id="rm">${T('toast_lock_off')}</button></div>`);
  const back=openModal(f); f.querySelector('#rm').onclick=async(e)=>{ if(await sha(f.querySelector('#cp').value)!==ME.lock_pin){ toast(T('lock_wrong')); return; }
    const b=e.target; b.disabled=true; b.innerHTML='<span class="spin"></span>';
    const {error}=await db.functions.invoke('create-employee',{body:{action:'clear_lock'}});
    if(error){ toast(T('err_generic')+(error.message||'')); b.disabled=false; b.textContent=T('toast_lock_off'); return; }
    ME.lock_pin=null; try{ localStorage.setItem('cw_me',JSON.stringify(ME)); }catch(_){} back.remove(); toast(T('toast_lock_off')); render(); }; }
/* clear someone else's app lock remotely (owner/manager) */
async function clearLockFor(userId){ const {error}=await db.functions.invoke('create-employee',{body:{action:'clear_lock',user_id:userId}});
  if(error){ let m=error.message; try{ if(error.context){ const j=await error.context.json(); if(j&&j.error) m=j.error; } }catch(_){}
    toast(T('err_generic')+m); return false; } toast(T('toast_lock_cleared')); return true; }

function doRestore(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=async()=>{ const file=inp.files&&inp.files[0]; if(!file) return; if(!confirm(T('restore_confirm'))) return;
    let data; try{ data=JSON.parse(await file.text()); }catch(_){ toast(T('restore_bad')); return; }
    if(!data||data.app!=='carwash'||!Array.isArray(data.lots)){ toast(T('restore_bad')); return; }
    toast(T('restoring'));
    if(data.lots.length){ const {error}=await db.from('lots').upsert(data.lots,{onConflict:'id'}); if(error){ toast(T('err_generic')+error.message); return; } }
    for(const e of (data.employees||[])){ try{ await db.from('profiles').upsert({id:e.id,full_name:e.full_name,username:e.username,language:e.language||'he',active:e.active!==false,role:'employee'},{onConflict:'id'}); }catch(_){} }
    toast(T('restore_done')); render();
  };
  inp.click();
}

    db.from('profiles').select('id,full_name,username').eq('role','employee').not('archived_at','is',null).order('full_name')]);
  const empMap=await employeeMap();
  const m=el(`<div><h3>${T('bin_title')}</h3><div id="binBody"></div><button class="btn ghost" style="margin-top:12px" id="cl">✕</button></div>`);
  const back=openModal(m); m.querySelector('#cl').onclick=()=>back.remove();
  const body=m.querySelector('#binBody'); const nL=(lots||[]).length, nA=(asgs||[]).length, nE=(arch||[]).length;
  if(!nL&&!nA&&!nE){ body.innerHTML=`<div class="empty">${T('bin_empty')}</div>`; return; }
  const mkRow=(label,restoreFn,purgeFn)=>{ const c=el(`<div class="card" style="margin:0 0 10px"><div style="margin-bottom:8px">${label}</div><div class="row" style="gap:8px"><button class="btn ghost" data-r="1">${T('restore')}</button>${purgeFn?`<button class="btn danger" data-p="1">${T('delete_forever')}</button>`:''}</div></div>`);
    c.querySelector('[data-r]').onclick=async()=>{ await restoreFn(); toast(T('toast_restored')); back.remove(); binModal(); render(); };
    const pb=c.querySelector('[data-p]'); if(pb) pb.onclick=async()=>{ if(!confirm(T('delete_forever')+'?')) return; await purgeFn(); toast(T('toast_deleted')); back.remove(); binModal(); };
    return c; };
  if(nE){ body.appendChild(el(`<div style="margin:6px 2px 8px;font-weight:800;color:var(--gold)">${T('bin_emps')} (${nE})</div>`));
    arch.forEach(e=>body.appendChild(mkRow(`👤 ${esc(e.full_name||'')} <span class="muted" style="font-size:12px">@${esc(e.username||'')}</span>`,
      ()=>db.functions.invoke('create-employee',{body:{action:'unarchive',user_id:e.id}}), null))); }  // restore only
  if(nL){ body.appendChild(el(`<div style="margin:14px 2px 8px;font-weight:800;color:var(--muted)">${T('bin_lots')} (${nL})</div>`));
    lots.forEach(l=>body.appendChild(mkRow(`📍 ${esc(l.name)} <span class="muted" style="font-size:12px">${esc(l.region||'')}</span>`,
      ()=>db.from('lots').update({deleted_at:null}).eq('id',l.id), ()=>db.from('lots').delete().eq('id',l.id)))); }
  if(nA){ body.appendChild(el(`<div style="margin:14px 2px 8px;font-weight:800;color:var(--muted)">${T('bin_asgs')} (${nA})</div>`));
    asgs.forEach(a=>body.appendChild(mkRow(`🗓️ ${esc(a.lots?.name||'')} · ${fmtDate(a.work_date)} · ${esc(empMap[a.employee_id]||'')}`,
      ()=>db.from('assignments').update({deleted_at:null}).eq('id',a.id), ()=>db.from('assignments').delete().eq('id',a.id)))); }
}

async function startApp(){
  const {data:{session}}=await db.auth.getSession();
  if(session){ await boot(); } else { showLogin(); maybeOnboard(); }
}

/* ================= START ================= */
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('loginPass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('lgLang').onclick=langMenu;
document.getElementById('hLang').onclick=langMenu;
document.getElementById('lgShare').onclick=shareApp;
document.getElementById('hShare').onclick=shareApp;
document.getElementById('lgTheme').onclick=()=>{ toggleTheme(); };
document.getElementById('hTheme').onclick=()=>{ toggleTheme(); };
applyLang(); applyTheme();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
if(location.protocol==='file:'){ const e=document.getElementById('loginErr'); if(e) e.textContent='⚠ '+({he:'פתח דרך הקישור המאובטח (https), לא כקובץ מקומי',en:'Open via the secure https link, not as a local file'}[LANG]||'Open via the secure https link'); }
startApp();
</script>
